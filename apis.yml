aid: apptimize
name: Apptimize
description: >-
  Apptimize is a mobile-first A/B testing, multivariate testing, and feature
  management platform for optimizing user experiences across iOS, Android, web,
  and server-side channels. Product teams use Apptimize to run experiments,
  ship feature flags with controlled rollouts, deliver instant updates without
  app-store releases, and set dynamic variables that can be changed on the fly.
  Apptimize ships client and server SDKs for iOS/tvOS/watchOS, Android, Web,
  React Native, Python, Flutter, and Roku, plus a REST API for retrieving
  variant assignments and tracking events from any device or backend. Apptimize
  was acquired by Airship in 2019; its developer documentation and SDKs remain
  published at apptimize.com/docs, and the marketing site now redirects to
  airship.com.
